name: Android Build

# 所有 uses 都钉到完整 commit SHA，理由见 ci.yml 顶部注释。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 构建 job 只需要读仓库。写权限留给下面单独的 release job ——
# 让「装依赖 + 跑 Gradle」这一大段执行过程全程握着写 token 是不必要的暴露面。
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Quality gate (typecheck + tests)
        run: |
          npm run typecheck
          npm test

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChronoDeck-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChronoDeck-APK
          path: ChronoDeck-debug.apk

  # 只有这一步需要写仓库权限，所以它被单独拆出来。
  # 注意 softprops/action-gh-release 是本项目唯一的第三方 action ——
  # 浮动 tag 配上写 token 是全表杠杆最高的一处，所以它也钉得最死。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ChronoDeck-debug.apk
          generate_release_notes: true
